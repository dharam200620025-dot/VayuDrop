<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VayuDrop - Fast P2P File Sharing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background Glow Effects -->
    <div class="glow-circle circle-purple"></div>
    <div class="glow-circle circle-cyan"></div>

    <div class="container">
        <!-- Header Section -->
        <header>
            <h1 class="logo">Vayu<span>Drop</span></h1>
            <p class="tagline">Direct, Secure & Lightning Fast</p>
        </header>

        <!-- Glassmorphism Card -->
        <main class="glass-card">
            
            <!-- File Select Area -->
            <div class="upload-container" style="text-align: center;">
    <!-- Hidden File Input -->
    <input type="file" id="fileInput" style="display: none;" onchange="startUpload()">
    
    <!-- Stylish Upload Button -->
    <button class="primary-btn" onclick="document.getElementById('fileInput').click()">
        📁 Select File to Drop
    </button>
    
    <!-- Status Text -->
    <p id="uploadStatus" style="color: rgba(255,255,255,0.6); margin-top: 15px; font-size: 14px;"></p>
    
    <!-- Result Box (Hidden by default) -->
    <div id="resultBox" style="display: none; margin-top: 20px; background: rgba(0,255,136,0.1); padding: 15px; border-radius: 15px; border: 1px solid #00ff88;">
        <p style="color: #00ff88; margin-bottom: 10px; font-weight: bold;">Link Ready! 🔗</p>
        <input type="text" id="shareLink" readonly style="width: 100%; background: rgba(0,0,0,0.5); border: none; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: center;">
        <button onclick="copyLink()" class="secondary-btn" style="padding: 10px; font-size: 14px;">Copy Link 📋</button>
    </div>
            </div>
            

            <!-- Link Sharing Area -->
            <div id="linkContainer" class="hidden" style="margin-top: 20px; text-align: center;">
                <p style="color: #94a3b8; margin-bottom: 10px; font-size: 0.9rem;">Share this link with receiver:</p>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="shareLink" readonly style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
                    <button id="copyBtn" class="browse-btn" style="padding: 10px 15px;">Copy</button>
                </div>
            </div>

            <!-- Transfer Status Area -->
            <div class="transfer-status hidden" id="transferStatus">
                <div class="file-details">
                    <span id="fileName">video.mp4</span>
                    <span id="fileSize">245 MB</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p class="status-text" id="statusText">Waiting...</p>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
    <script>// File select hote hi upload shuru karne ka function
function startUpload() {
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('uploadStatus');
    const resultBox = document.getElementById('resultBox');
    
    // Agar user ne koi file select nahi ki
    if (fileInput.files.length === 0) return;
    
    const file = fileInput.files[0];
    
    // UI Update: Uploading text dikhayein
    statusText.innerHTML = `Uploading: <b>${file.name}</b> ⏳<br><span style="font-size: 12px;">Please wait...</span>`;
    resultBox.style.display = "none";

    uploadToFileIO(file);
}

// File.io API par file bhejne ka main function
async function uploadToFileIO(file) {
    const formData = new FormData();
    formData.append('file', file);
    
    try {
        const response = await fetch('https://file.io', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            // Upload successful hone par
            document.getElementById('uploadStatus').innerHTML = "Upload Complete! 🎉";
            document.getElementById('shareLink').value = data.link;
            document.getElementById('resultBox').style.display = "block"; // Box dikhayein
        } else {
            // Kisi error ke aane par
            document.getElementById('uploadStatus').innerHTML = "Upload Failed! ❌ Pata nahi kya hua.";
        }
    } catch (error) {
        document.getElementById('uploadStatus').innerHTML = "Network Error! ❌ Internet check karein.";
        console.error("API Error:", error);
    }
}

// Link Copy karne ka function
function copyLink() {
    const linkInput = document.getElementById('shareLink');
    linkInput.select();
    document.execCommand("copy");
    
    const statusText = document.getElementById('uploadStatus');
    statusText.innerHTML = "<span style='color: #00ff88;'>Link Copied! 🚀 Doston ke sath share karein!</span>";
}
    </script>
</body>
</html>
